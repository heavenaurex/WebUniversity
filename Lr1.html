<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторна: форма реєстрації</title>
    <link rel="stylesheet" href="Pr2.css">
</head>
<body>

<p><a href="index.html">← До списку робіт</a></p>

<h1>Реєстрація</h1>

<form action="https://webhook.site/6a7b1adb-c955-4150-a7ee-cb95b196ba9d" method="post">

    <div>
        <label for="first-name">Ім'я</label>
        <input type="text" id="first-name" name="first_name" required>
    </div>

    <div>
        <label for="last-name">Прізвище</label>
        <input type="text" id="last-name" name="last_name" required>
    </div>

    <div>
        <label for="email">Адреса електронної пошти</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div>
        <label for="password-confirm">Підтвердження паролю</label>
        <input type="password" id="password-confirm" name="password_confirm" required>
    </div>

    <div>
        <label for="birth-date">Дата народження</label>
        <input type="date" id="birth-date" name="birth_date">
    </div>

    <div>
        <label for="gender">Стать</label>
        <select id="gender" name="gender">
            <option value="">Не обрано</option>
            <option value="female">Жіноча</option>
            <option value="male">Чоловіча</option>
            <option value="other">Інша</option>
        </select>
    </div>

    <div>
        <input type="submit" value="Зареєструватися">
    </div>

</form>

</body>
</html>
