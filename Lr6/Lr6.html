
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratory 6 - Electrode Explosion</title>

    <link rel="stylesheet" href="Lr6.css">
</head>

<body>

<main class="page">

    <header class="header">
        <h1>Electrode: Energy Overload</h1>
        <p>CSS Sprite Animation Experiment</p>
    </header>

    <section class="stage">

        <!-- Animated sky -->
        <div class="sky"></div>

        <!-- Stars -->
        <div class="stars"></div>

        <!-- Moving clouds -->
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>

        <!-- Electric atmosphere -->
        <div class="electricity electricity-one"></div>
        <div class="electricity electricity-two"></div>

        <!-- Pokemon -->
        <div class="pokemon-container">

            <div class="pokemon-shadow"></div>

            <div
                    class="pokemon-sprite"
                    role="img"
                    aria-label="Electrode charging and exploding">
            </div>

        </div>

        <!-- Explosion effects -->
        <div class="shockwave"></div>
        <div class="explosion-flash"></div>
        <div class="explosion-particles"></div>

        <!-- Ground -->
        <div class="ground"></div>

        <!-- Scene caption -->
        <div class="scene-caption">
            <span class="caption-normal">ENERGY DETECTED</span>
            <span class="caption-warning">WARNING: OVERLOAD!</span>
            <span class="caption-explosion">SELF-DESTRUCT!</span>
        </div>

    </section>

    <footer class="footer">
        <p>
            Pokemon sprite:
            <a href="https://pokemondb.net/pokedex/electrode"
               target="_blank"
               rel="noopener noreferrer">
                PokemonDB - Electrode
            </a>
        </p>

        <p>Animation created using HTML and CSS</p>
    </footer>

</main>

</body>
</html>
