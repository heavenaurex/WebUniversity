<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Клавіатура UA / EN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Pr4.css">
</head>
<body>
<div class="page">

    <header class="page__head">
        <h1>Клавіатура</h1>
        <p>Українська | English</p>
    </header>

    <main class="page__board">
        <div class="keyboard">

            <!-- Ряд 1: Esc і т.д -->
            <button class="key key--fn w4">Esc</button>
            <span class="s4"></span>
            <button class="key key--fn w4">F1</button><button class="key key--fn w4">F2</button><button class="key key--fn w4">F3</button><button class="key key--fn w4">F4</button>
            <span class="s2"></span>
            <button class="key key--fn w4">F5</button><button class="key key--fn w4">F6</button><button class="key key--fn w4">F7</button><button class="key key--fn w4">F8</button>
            <span class="s2"></span>
            <button class="key key--fn w4">F9</button><button class="key key--fn w4">F10</button><button class="key key--fn w4">F11</button><button class="key key--fn w4">F12</button>
            <span class="s1"></span>
            <button class="key key--fn w4">PrtSc</button><button class="key key--fn w4">ScrLk</button><button class="key key--fn w4">Pause</button>

            <span class="s90"></span>

            <!-- Ряд 2: цифри -->
            <button class="key key--sym w4"><span class="l l-en tl">~</span><span class="l l-en bl">`</span><span class="l l-ua tr">₴</span><span class="l l-ua br">’</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">!</span><span class="l l-en bl">1</span><span class="l l-ua tr">!</span><span class="l l-ua br">1</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">@</span><span class="l l-en bl">2</span><span class="l l-ua tr">"</span><span class="l l-ua br">2</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">#</span><span class="l l-en bl">3</span><span class="l l-ua tr">№</span><span class="l l-ua br">3</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">$</span><span class="l l-en bl">4</span><span class="l l-ua tr">;</span><span class="l l-ua br">4</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">%</span><span class="l l-en bl">5</span><span class="l l-ua tr">%</span><span class="l l-ua br">5</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">^</span><span class="l l-en bl">6</span><span class="l l-ua tr">:</span><span class="l l-ua br">6</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">&amp;</span><span class="l l-en bl">7</span><span class="l l-ua tr">?</span><span class="l l-ua br">7</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">*</span><span class="l l-en bl">8</span><span class="l l-ua tr">*</span><span class="l l-ua br">8</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">(</span><span class="l l-en bl">9</span><span class="l l-ua tr">(</span><span class="l l-ua br">9</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">)</span><span class="l l-en bl">0</span><span class="l l-ua tr">)</span><span class="l l-ua br">0</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">_</span><span class="l l-en bl">-</span><span class="l l-ua tr">_</span><span class="l l-ua br">-</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">+</span><span class="l l-en bl">=</span><span class="l l-ua tr">+</span><span class="l l-ua br">=</span></button>
            <button class="key key--mod w8">Backspace</button>
            <span class="s1"></span>
            <button class="key key--mod w4">Ins</button><button class="key key--mod w4">Home</button><button class="key key--mod w4">PgUp</button>
            <span class="s1"></span>
            <button class="key key--num w4 is-on">Num</button><button class="key key--num w4">/</button><button class="key key--num w4">*</button><button class="key key--num w4">−</button>

            <!-- Ряд 3: QWERTY та ЙЦУКЕН -->
            <button class="key key--mod w6">Tab</button>
            <button class="key key--letter w4"><span class="l l-en tl">Q</span><span class="l l-ua br">Й</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">W</span><span class="l l-ua br">Ц</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">E</span><span class="l l-ua br">У</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">R</span><span class="l l-ua br">К</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">T</span><span class="l l-ua br">Е</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">Y</span><span class="l l-ua br">Н</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">U</span><span class="l l-ua br">Г</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">I</span><span class="l l-ua br">Ш</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">O</span><span class="l l-ua br">Щ</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">P</span><span class="l l-ua br">З</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">{</span><span class="l l-en bl">[</span><span class="l l-ua br">Х</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">}</span><span class="l l-en bl">]</span><span class="l l-ua br">Ї</span></button>
            <button class="key key--sym w6"><span class="l l-en tl">|</span><span class="l l-en bl">\</span><span class="l l-ua br">Ґ</span></button>
            <span class="s1"></span>
            <button class="key key--mod w4">Del</button><button class="key key--mod w4">End</button><button class="key key--mod w4">PgDn</button>
            <span class="s1"></span>
            <button class="key key--num w4">7</button><button class="key key--num w4">8</button><button class="key key--num w4">9</button>
            <button class="key key--num w4 h2">+</button>

            <!-- Ряд 4: ASDF та ФІВА -->
            <button class="key key--mod w7">Caps Lock</button>
            <button class="key key--letter w4"><span class="l l-en tl">A</span><span class="l l-ua br">Ф</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">S</span><span class="l l-ua br">І</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">D</span><span class="l l-ua br">В</span></button>
            <button class="key key--letter key--bump w4"><span class="l l-en tl">F</span><span class="l l-ua br">А</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">G</span><span class="l l-ua br">П</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">H</span><span class="l l-ua br">Р</span></button>
            <button class="key key--letter key--bump w4"><span class="l l-en tl">J</span><span class="l l-ua br">О</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">K</span><span class="l l-ua br">Л</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">L</span><span class="l l-ua br">Д</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">:</span><span class="l l-en bl">;</span><span class="l l-ua br">Ж</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">"</span><span class="l l-en bl">'</span><span class="l l-ua br">Є</span></button>
            <button class="key key--mod w9">Enter</button>
            <span class="s14"></span>
            <button class="key key--num w4">4</button><button class="key key--num w4">5</button><button class="key key--num w4">6</button>

            <!-- Ряд 5: ZXCV та ЯЧСМ -->
            <button class="key key--mod w9">Shift</button>
            <button class="key key--letter w4"><span class="l l-en tl">Z</span><span class="l l-ua br">Я</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">X</span><span class="l l-ua br">Ч</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">C</span><span class="l l-ua br">С</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">V</span><span class="l l-ua br">М</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">B</span><span class="l l-ua br">И</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">N</span><span class="l l-ua br">Т</span></button>
            <button class="key key--letter w4"><span class="l l-en tl">M</span><span class="l l-ua br">Ь</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">&lt;</span><span class="l l-en bl">,</span><span class="l l-ua br">Б</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">&gt;</span><span class="l l-en bl">.</span><span class="l l-ua br">Ю</span></button>
            <button class="key key--sym w4"><span class="l l-en tl">?</span><span class="l l-en bl">/</span><span class="l l-ua tr">,</span><span class="l l-ua br">.</span></button>
            <button class="key key--mod w11">Shift</button>
            <span class="s5"></span>
            <button class="key key--mod w4">↑</button>
            <span class="s5"></span>
            <button class="key key--num w4">1</button><button class="key key--num w4">2</button><button class="key key--num w4">3</button>
            <button class="key key--num w4 h2">Enter</button>

            <!-- Ряд 6 -->
            <button class="key key--mod w5">Ctrl</button><button class="key key--mod w5">Win</button><button class="key key--mod w5">Alt</button>
            <button class="key key--space w25"></button>
            <button class="key key--mod w5">Alt</button><button class="key key--mod w5">Win</button><button class="key key--mod w5">Menu</button><button class="key key--mod w5">Ctrl</button>
            <span class="s1"></span>
            <button class="key key--mod w4">←</button><button class="key key--mod w4">↓</button><button class="key key--mod w4">→</button>
            <span class="s1"></span>
            <button class="key key--num w8">0</button><button class="key key--num w4">.</button>

        </div>
    </main>

</div>
</body>
</html>
