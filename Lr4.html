<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weekly Planner</title>

    <link rel="stylesheet" href="Lr4.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="planner">

    <header class="header">

        <div class="header-title">
            WEEKLY PLAN
        </div>

        <div class="header-info">

            <div class="week">
                <label for="week">WEEK OF:</label>
                <input type="text" id="week">
            </div>

            <div class="habit">
                <label for="habit">HEALTHY HABIT</label>
                <input type="text" id="habit">
            </div>

        </div>

        <div class="header-status">

            <label>
                ROCKED IT
                <input type="checkbox" aria-label="Rocked it">
            </label>

            <label>
                ROOM FOR IMPROVEMENT
                <input type="checkbox" aria-label="Room for improvement">
            </label>

        </div>

    </header>


    <aside class="sidebar">

        <section class="task-section goals">

            <h3>TOP 3 GOALS</h3>

            <div class="task-list">

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete goal 1">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Goal 1</span>
                        <input type="text" aria-label="Goal 1">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete goal 2">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Goal 2</span>
                        <input type="text" aria-label="Goal 2">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete goal 3">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Goal 3</span>
                        <input type="text" aria-label="Goal 3">
                    </label>
                </div>

            </div>

        </section>


        <section class="task-section everything">

            <h3>EVERYTHING ELSE</h3>

            <div class="task-list">

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 1">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 1</span>
                        <input type="text" aria-label="Task 1">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 2">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 2</span>
                        <input type="text" aria-label="Task 2">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 3">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 3</span>
                        <input type="text" aria-label="Task 3">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 4">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 4</span>
                        <input type="text" aria-label="Task 4">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 5">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 5</span>
                        <input type="text" aria-label="Task 5">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 6">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 6</span>
                        <input type="text" aria-label="Task 6">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 7">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 7</span>
                        <input type="text" aria-label="Task 7">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 8">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 8</span>
                        <input type="text" aria-label="Task 8">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 9">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 9</span>
                        <input type="text" aria-label="Task 9">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 10">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 10</span>
                        <input type="text" aria-label="Task 10">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 11">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 11</span>
                        <input type="text" aria-label="Task 11">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete task 12">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Task 12</span>
                        <input type="text" aria-label="Task 12">
                    </label>
                </div>

            </div>

        </section>


        <section class="task-section next-week">

            <h3>NEXT WEEK</h3>

            <div class="task-list">

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete next week task 1">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Next week task 1</span>
                        <input type="text" aria-label="Next week task 1">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete next week task 2">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Next week task 2</span>
                        <input type="text" aria-label="Next week task 2">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete next week task 3">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Next week task 3</span>
                        <input type="text" aria-label="Next week task 3">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete next week task 4">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Next week task 4</span>
                        <input type="text" aria-label="Next week task 4">
                    </label>
                </div>

                <div class="task">
                    <label class="check-label">
                        <input type="checkbox" aria-label="Complete next week task 5">
                    </label>
                    <label class="task-input">
                        <span class="visually-hidden">Next week task 5</span>
                        <input type="text" aria-label="Next week task 5">
                    </label>
                </div>

            </div>

        </section>

    </aside>


    <section class="day monday">

        <div class="day-title">
            <h3>MONDAY</h3>

            <label>
                <span class="visually-hidden">Monday completed</span>
                <input type="checkbox">
            </label>
        </div>

        <label class="visually-hidden" for="monday-plans">
            Monday plans
        </label>

        <textarea id="monday-plans"></textarea>

    </section>


    <section class="day tuesday">

        <div class="day-title">
            <h3>TUESDAY</h3>

            <label>
                <span class="visually-hidden">Tuesday completed</span>
                <input type="checkbox">
            </label>
        </div>

        <label class="visually-hidden" for="tuesday-plans">
            Tuesday plans
        </label>

        <textarea id="tuesday-plans"></textarea>

    </section>


    <section class="day wednesday">

        <div class="day-title">
            <h3>WEDNESDAY</h3>

            <label>
                <span class="visually-hidden">Wednesday completed</span>
                <input type="checkbox">
            </label>
        </div>

        <label class="visually-hidden" for="wednesday-plans">
            Wednesday plans
        </label>

        <textarea id="wednesday-plans"></textarea>

    </section>


    <section class="day thursday">

        <div class="day-title">
            <h3>THURSDAY</h3>

            <label>
                <span class="visually-hidden">Thursday completed</span>
                <input type="checkbox">
            </label>
        </div>

        <label class="visually-hidden" for="thursday-plans">
            Thursday plans
        </label>

        <textarea id="thursday-plans"></textarea>

    </section>


    <section class="day friday">

        <div class="day-title">
            <h3>FRIDAY</h3>

            <label>
                <span class="visually-hidden">Friday completed</span>
                <input type="checkbox">
            </label>
        </div>

        <label class="visually-hidden" for="friday-plans">
            Friday plans
        </label>

        <textarea id="friday-plans"></textarea>

    </section>


    <div class="weekend">

        <section class="day saturday">

            <div class="day-title">
                <h3>SATURDAY</h3>

                <label>
                    <span class="visually-hidden">Saturday completed</span>
                    <input type="checkbox">
                </label>
            </div>

            <label class="visually-hidden" for="saturday-plans">
                Saturday plans
            </label>

            <textarea id="saturday-plans"></textarea>

        </section>


        <section class="day sunday">

            <div class="day-title">
                <h3>SUNDAY</h3>

                <label>
                    <span class="visually-hidden">Sunday completed</span>
                    <input type="checkbox">
                </label>
            </div>

            <label class="visually-hidden" for="sunday-plans">
                Sunday plans
            </label>

            <textarea id="sunday-plans"></textarea>

        </section>

    </div>

</div>

</body>
</html>
