<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Новорічна листівка з теплими побажаннями.">
  <title>Winter Wonderland — Новорічна листівка</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="page">
  <main class="postcard">
    <div class="postcard__stars" aria-hidden="true"></div>
    <div class="snow" aria-hidden="true">
      <span class="snow__flake snow__flake--one"></span>
      <span class="snow__flake snow__flake--two"></span>
      <span class="snow__flake snow__flake--three"></span>
      <span class="snow__flake snow__flake--four"></span>
      <span class="snow__flake snow__flake--five"></span>
      <span class="snow__flake snow__flake--six"></span>
      <span class="snow__flake snow__flake--seven"></span>
      <span class="snow__flake snow__flake--eight"></span>
      <span class="snow__flake snow__flake--nine"></span>
      <span class="snow__flake snow__flake--ten"></span>
      <span class="snow__flake snow__flake--eleven"></span>
      <span class="snow__flake snow__flake--twelve"></span>
    </div>

    <header class="postcard__header">
      <p class="postcard__eyebrow">A little winter magic</p>
      <h1 class="postcard__title">З Новим<br><span class="postcard__title-accent">роком!</span></h1>
      <p class="postcard__subtitle">Нехай диво знайде дорогу до твого дому</p>
    </header>

    <section class="winter-scene" aria-label="Зимовий пейзаж із ялинкою">
      <div class="moon" aria-hidden="true"></div>
      <div class="hill hill--back" aria-hidden="true"></div>
      <div class="hill hill--front" aria-hidden="true"></div>
      <div class="tree tree--small" aria-hidden="true">
        <span class="tree__top"></span><span class="tree__middle"></span><span class="tree__bottom"></span><span class="tree__trunk"></span>
      </div>
      <div class="tree tree--main" aria-hidden="true">
        <span class="tree__top"></span><span class="tree__middle"></span><span class="tree__bottom"></span><span class="tree__trunk"></span>
        <span class="tree__star">✦</span>
        <span class="tree__ornament tree__ornament--one"></span>
        <span class="tree__ornament tree__ornament--two"></span>
        <span class="tree__ornament tree__ornament--three"></span>
      </div>
      <div class="gift gift--one" aria-hidden="true"><span></span></div>
      <div class="gift gift--two" aria-hidden="true"><span></span></div>
    </section>

    <footer class="postcard__footer">
      <p class="postcard__footer-text">Світла • затишку • натхнення</p>
      <button class="wish-button" type="button" aria-expanded="false" aria-controls="wish">
        <span class="wish-button__label">Відкрити побажання</span>
        <span class="wish-button__icon" aria-hidden="true">✧</span>
      </button>
      <p class="wish" id="wish" hidden>
        Нехай новий рік принесе сміливі мрії, щирі усмішки та багато приводів для радості.
        Бережи тепло в серці й вір у дива!
      </p>
      <p class="postcard__signature">З найкращими побажаннями ♥</p>
    </footer>
  </main>
</body>
</html>
